spring:
  application:
    name: asclepio-storage-service

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

server:
  port: 8081

r2:
  access-key: ${R2_ACCESS_KEY}
  secret-key: ${R2_SECRET_KEY}
  bucket: ${R2_BUCKET}
  endpoint: ${R2_ENDPOINT}
  public-url: ${R2_PUBLIC_URL}
api:
  security:
    token:
      secret: ${JWT_SECRET}